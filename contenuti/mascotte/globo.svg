<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Globo</title>
  <desc>Globo, la mascotte dell'atlante: un globulo rosso ovale con occhi tondi, sopracciglia e guance rosa. Posa di riferimento, a livelli separati per l'animazione.</desc>
