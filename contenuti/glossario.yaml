# Glossario (D26): una voce per termine usato nei testi, con una definizione breve e le sue fonti.
#
# termine: come compare nel titolo della voce; varianti: altre forme cercate nell'Indice (plurali).
# Nei testi un termine rimanda alla voce con [[parola mostrata|id-della-voce]].
# Ogni definizione cita almeno una fonte di fonti.yaml; stati e date come per le strutture (D17).
# Definizioni verificate il 2026-10-24 sul testo delle fonti citate.

alveolo:
  termine: alveolo
  varianti: [alveoli]
  definizione: >
    Minuscola sacca d'aria, simile a un acino d'uva, in cui finiscono le vie aeree dei polmoni. Negli
    alveoli avviene lo scambio dei gas tra l'aria e il sangue [@nhlbi-polmoni-sistema] [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

aorta:
  termine: aorta
  definizione: >
    La grande arteria in cui il ventricolo sinistro spinge il sangue ricco di ossigeno, diretto a
    tutto il corpo [@nhlbi-cuore-flusso] [@openstax-ap-19-1].
  stato: approvato
  revisione: 2026-10-24

arteria-polmonare:
  termine: arteria polmonare
  varianti: [arterie polmonari]
  definizione: >
    L'arteria che porta dal cuore ai polmoni il sangue povero di ossigeno; i suoi rami arrivano ai
    capillari attorno agli alveoli [@nhlbi-cuore-flusso] [@nhlbi-polmoni-sistema].
  stato: approvato
  revisione: 2026-10-24

atrio:
  termine: atrio
  varianti: [atri]
  definizione: >
    Ciascuna delle due cavità superiori del cuore. Raccoglie il sangue che arriva al cuore e,
    contraendosi, lo spinge nel ventricolo sottostante [@nhlbi-cuore-anatomia] [@openstax-ap-19-1].
  stato: approvato
  revisione: 2026-10-24

bronchiolo:
  termine: bronchiolo
  varianti: [bronchioli]
  definizione: >
    Ciascuno dei tubi più sottili in cui si ramificano i bronchi dentro i polmoni. Misura circa un
    millimetro di diametro e, a differenza dei bronchi, non ha cartilagine nella parete
    [@nhlbi-polmoni-sistema] [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

bronco:
  termine: bronco
  varianti: [bronchi]
  definizione: >
    Ciascuno dei due tubi, destro e sinistro, in cui si divide la trachea e che portano l'aria ai
    polmoni, dove continuano a ramificarsi. Anelli di cartilagine li sostengono e impediscono che si
    chiudano [@nhlbi-polmoni-sistema] [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

capillare:
  termine: capillare
  varianti: [capillari]
  definizione: >
    Vaso sanguigno sottilissimo. Attorno agli alveoli i capillari formano una rete, e la loro parete,
    unita a quella dell'alveolo, forma la membrana che i gas attraversano [@nhlbi-polmoni-sistema]
    [@openstax-ap-22-2].
  stato: approvato
  revisione: 2026-10-24

diastole:
  termine: diastole
  definizione: >
    La fase del ciclo cardiaco in cui il cuore si rilassa e le sue cavità si riempiono di sangue
    [@openstax-ap-19-3].
  stato: approvato
  revisione: 2026-10-24

diffusione:
  termine: diffusione
  definizione: >
    Il passaggio di un gas da dove la sua pressione parziale è più alta a dove è più bassa, senza
    bisogno di energia. Così, negli alveoli, l'ossigeno passa dall'aria al sangue e l'anidride
    carbonica dal sangue all'aria [@openstax-ap-22-4] [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

espirazione:
  termine: espirazione
  definizione: >
    Il processo che fa uscire l'aria dai polmoni. Nella respirazione tranquilla è passiva: i muscoli
    si rilasciano e il tessuto elastico dei polmoni li fa tornare indietro [@openstax-ap-22-3].
  stato: approvato
  revisione: 2026-10-24

ilo:
  termine: ilo polmonare
  varianti: [ilo]
  definizione: >
    La zona incavata di ogni polmone da cui entra il bronco principale, insieme a vasi sanguigni,
    vasi linfatici e nervi [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

inspirazione:
  termine: inspirazione
  definizione: >
    Il processo che fa entrare l'aria nei polmoni. Nella respirazione tranquilla lo producono il
    diaframma e i muscoli intercostali esterni [@openstax-ap-22-3].
  stato: approvato
  revisione: 2026-10-24

lobo:
  termine: lobo polmonare
  varianti: [lobo, lobi]
  definizione: >
    Ciascuna delle parti in cui è diviso un polmone, separate da scissure: tre nel polmone destro
    (superiore, medio e inferiore), due nel sinistro (superiore e inferiore) [@openstax-ap-22-2].
  stato: approvato
  revisione: 2026-10-24

mediastino:
  termine: mediastino
  definizione: >
    Lo spazio al centro della cavità toracica, tra i due polmoni, in cui si trova il cuore
    [@openstax-ap-19-1].
  stato: approvato
  revisione: 2026-10-24

miocardio:
  termine: miocardio
  definizione: >
    Lo strato intermedio e più spesso della parete del cuore, formato soprattutto da cellule
    muscolari cardiache. Contraendosi, spinge il sangue fuori dal cuore [@openstax-ap-19-1]
    [@nhlbi-cuore-anatomia].
  stato: approvato
  revisione: 2026-10-24

nodo-atrioventricolare:
  termine: nodo atrioventricolare
  definizione: >
    Gruppo di cellule tra gli atri e i ventricoli in cui il segnale elettrico del battito rallenta
    leggermente, così i ventricoli hanno il tempo di finire di riempirsi [@nhlbi-cuore-battito].
  stato: approvato
  revisione: 2026-10-24

nodo-senoatriale:
  termine: nodo senoatriale
  definizione: >
    Gruppo di cellule nell'atrio destro, chiamate cellule pacemaker, da cui parte il segnale
    elettrico di ogni battito [@nhlbi-cuore-battito].
  stato: approvato
  revisione: 2026-10-24

pericardio:
  termine: pericardio
  definizione: >
    Il sacco di sottili strati di tessuto che avvolge il cuore, lo tiene in posizione e lo protegge.
    Un po' di liquido tra gli strati riduce l'attrito mentre il cuore batte [@nhlbi-cuore-anatomia]
    [@openstax-ap-19-1].
  stato: approvato
  revisione: 2026-10-24

pleura:
  termine: pleura
  definizione: >
    Membrana a due foglietti che avvolge ogni polmone: quello interno aderisce al polmone, quello
    esterno alla parete del torace, al mediastino e al diaframma. Lo spazio tra i due, la cavità
    pleurica, contiene il liquido pleurico, che riduce l'attrito durante il respiro [@openstax-ap-22-2]
    [@nhlbi-polmoni-sistema].
  stato: approvato
  revisione: 2026-10-24

scissura:
  termine: scissura
  varianti: [scissure]
  definizione: >
    Solco profondo che separa i lobi di un polmone, rivestito dal foglietto interno della pleura
    [@openstax-ap-22-2].
  stato: approvato
  revisione: 2026-10-24

sistole:
  termine: sistole
  definizione: >
    La fase del ciclo cardiaco in cui il cuore si contrae e spinge il sangue in circolo
    [@openstax-ap-19-3].
  stato: approvato
  revisione: 2026-10-24

trachea:
  termine: trachea
  definizione: >
    Il tubo che porta l'aria dalla laringe verso i polmoni. È sostenuto da 16-20 pezzi di cartilagine
    a forma di C e in basso si divide nei bronchi destro e sinistro [@openstax-ap-22-1].
  stato: approvato
  revisione: 2026-10-24

valvola:
  termine: valvola cardiaca
  varianti: [valvola, valvole]
  definizione: >
    Struttura che separa le cavità del cuore, o il cuore dalle grandi arterie, e fa scorrere il
    sangue in una sola direzione, impedendogli di tornare indietro [@nhlbi-cuore-anatomia]
    [@nhlbi-cuore-flusso].
  stato: approvato
  revisione: 2026-10-24

vene-polmonari:
  termine: vene polmonari
  varianti: [vena polmonare]
  definizione: >
    Le vene che riportano al cuore, nell'atrio sinistro, il sangue ricco di ossigeno che arriva dai
    polmoni [@nhlbi-cuore-flusso] [@openstax-ap-19-3].
  stato: approvato
  revisione: 2026-10-24

ventricolo:
  termine: ventricolo
  varianti: [ventricoli]
  definizione: >
    Ciascuna delle due cavità inferiori del cuore, che sono le sue principali camere di pompaggio: il
    destro spinge il sangue verso i polmoni, il sinistro verso il resto del corpo [@openstax-ap-19-1]
    [@nhlbi-cuore-anatomia].
  stato: approvato
  revisione: 2026-10-24

# Genitali esterni femminili e uretra (2026-10-25). Parti che non sono nel modello 3D: "parteDi"
# indica la scheda che le descrive, e l'Indice le elenca nell'apparato di quella scheda; "latino"
# e "ta2" sono il termine della Terminologia Anatomica e il suo numero, verificati sul TA2 Viewer.

vulva:
  termine: vulva
  latino: vulva
  ta2: 3547
  parteDi: vagina
  varianti: [genitali esterni femminili, pudendo]
  definizione: >
    L'insieme dei genitali esterni femminili, detto anche pudendo. Comprende il monte del pube, le
    grandi e le piccole labbra, il clitoride e le ghiandole che si aprono nel vestibolo
    [@seer-genitali-esterni-femminili] [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

monte-del-pube:
  termine: monte del pube
  latino: mons pubis
  ta2: 3548
  parteDi: vagina
  definizione: >
    Cuscinetto di grasso nella parte anteriore della vulva, sopra l'osso pubico. Dopo la pubertà si
    copre di peli pubici [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

grandi-labbra:
  termine: grandi labbra
  latino: labium majus vulvae
  ta2: 3549
  parteDi: vagina
  varianti: [grande labbro]
  definizione: >
    Le due pieghe di pelle coperte di peli che iniziano appena dietro il monte del pube; le piccole
    labbra si trovano al loro interno. Vi arriva il legamento rotondo dell'utero [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

piccole-labbra:
  termine: piccole labbra
  latino: labium minus vulvae
  ta2: 3553
  parteDi: vagina
  varianti: [piccolo labbro]
  definizione: >
    Le due pieghe più sottili e più pigmentate che si trovano all'interno delle grandi labbra.
    Proteggono l'uretra e l'ingresso delle vie genitali, e nella parte alta e anteriore si uniscono
    attorno al clitoride. Forma e dimensioni variano naturalmente da persona a persona
    [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

clitoride:
  termine: clitoride
  latino: clitoris
  ta2: 3565
  parteDi: vagina
  definizione: >
    Organo erettile, simile al pene, che risponde alla stimolazione sessuale
    [@seer-genitali-esterni-femminili]. Deriva dalle stesse cellule del glande del pene e ha molti
    nervi, che lo rendono importante per la sensibilità sessuale e l'orgasmo [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

glande-del-clitoride:
  termine: glande del clitoride
  latino: glans clitoridis
  ta2: 3568
  parteDi: vagina
  definizione: >
    La parte del clitoride visibile all'esterno, circondata dalla parte alta e anteriore delle
    piccole labbra [@openstax-ap-27-2]. Nella Terminologia Anatomica il clitoride comprende anche un
    corpo e due radici, i pilastri, che non si vedono dall'esterno [@fipat-ta2].
  stato: approvato
  revisione: 2026-10-25

prepuzio-del-clitoride:
  termine: prepuzio del clitoride
  latino: preputium clitoridis
  ta2: 3555
  parteDi: vagina
  definizione: >
    La piega di pelle sopra il glande del clitoride, indicata nella figura della vulva del manuale
    OpenStax [@openstax-ap-27-2]. Nella Terminologia Anatomica è una parte delle piccole labbra
    [@fipat-ta2].
  stato: approvato
  revisione: 2026-10-25

vestibolo-della-vagina:
  termine: vestibolo della vagina
  latino: vestibulum vaginae
  ta2: 3558
  parteDi: vagina
  varianti: [vestibolo]
  definizione: >
    La zona della vulva, dietro il clitoride, in cui si aprono l'uretra, la vagina, le ghiandole
    parauretrali e le ghiandole vestibolari maggiori [@seer-genitali-esterni-femminili]. Il muco
    delle ghiandole vestibolari la mantiene umida [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

orifizio-uretrale-esterno-femminile:
  termine: orifizio uretrale esterno femminile
  latino: ostium externum urethrae femininae
  ta2: 3557
  parteDi: vagina
  varianti: [orifizio uretrale esterno, apertura dell'uretra, meato urinario]
  definizione: >
    L'apertura dell'uretra verso l'esterno. Nella donna si trova nel vestibolo, appena davanti
    all'apertura della vagina [@seer-uretra] [@seer-genitali-esterni-femminili].
  stato: approvato
  revisione: 2026-10-25

orifizio-vaginale:
  termine: orifizio vaginale
  latino: ostium vaginae
  ta2: 3562
  parteDi: vagina
  varianti: [apertura della vagina, introito vaginale]
  definizione: >
    L'apertura della vagina verso l'esterno, nel vestibolo. Si trova tra l'apertura dell'uretra e
    l'ano, e ai suoi lati sboccano le ghiandole vestibolari maggiori [@openstax-ap-27-2]
    [@seer-genitali-esterni-femminili].
  stato: approvato
  revisione: 2026-10-25

imene:
  termine: imene
  latino: hymen
  ta2: 3530
  parteDi: vagina
  definizione: >
    Membrana sottile e perforata che può coprire in parte l'ingresso della vagina. Già alla
    nascita è solo parziale, perché il flusso mestruale e le altre secrezioni devono poter uscire:
    per questo un imene intatto non indica la "verginità". Può lacerarsi con l'esercizio fisico
    intenso, con il rapporto e con il parto [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

ghiandole-vestibolari-maggiori:
  termine: ghiandole vestibolari maggiori
  latino: glandula vestibularis major
  ta2: 3563
  parteDi: vagina
  varianti: [ghiandole di Bartolini, ghiandola di Bartolini, ghiandola vestibolare maggiore]
  definizione: >
    Due ghiandole, dette anche di Bartolini, che sboccano ai lati dell'apertura della vagina, nel
    vestibolo [@openstax-ap-27-2] [@seer-genitali-esterni-femminili]. Producono muco che mantiene
    umida la zona del vestibolo [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

ghiandole-vestibolari-minori:
  termine: ghiandole vestibolari minori
  latino: glandulae vestibulares minores
  ta2: 3564
  parteDi: vagina
  definizione: >
    Piccole ghiandole che si trovano vicino al clitoride. Come le ghiandole vestibolari maggiori,
    producono muco che mantiene umida la zona del vestibolo [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-25

ghiandole-parauretrali:
  termine: ghiandole parauretrali
  latino: glandulae paraurethrales femininae
  ta2: 3440
  parteDi: vagina
  definizione: >
    Ghiandole che, come l'uretra e la vagina, si aprono nel vestibolo, dietro il clitoride
    [@seer-genitali-esterni-femminili]. Nella Terminologia Anatomica sono una parte dell'uretra
    femminile [@fipat-ta2].
  stato: approvato
  revisione: 2026-10-25

perineo:
  termine: perineo
  latino: perineum
  ta2: 131
  parteDi: vagina
  definizione: >
    La regione a forma di rombo tra la sinfisi pubica davanti, il coccige dietro e le tuberosità
    ischiatiche ai lati, appena sotto il pavimento pelvico. Si divide in un triangolo anteriore,
    urogenitale, che contiene i genitali esterni, e in uno posteriore, anale, che contiene l'ano
    [@openstax-ap-11-4].
  stato: approvato
  revisione: 2026-10-25

uretra:
  termine: uretra
  latino: urethra
  ta2: 3425
  definizione: >
    Il tubo dalle pareti sottili che porta l'urina dal fondo della vescica all'esterno. Nella donna
    è lunga 3-4 centimetri; nell'uomo circa 20 centimetri, e porta all'esterno anche lo sperma
    [@seer-uretra].
  stato: approvato
  revisione: 2026-10-25

uretra-femminile:
  termine: uretra femminile
  latino: urethra feminina
  ta2: 3426
  parteDi: uretra
  definizione: >
    L'uretra della donna: è corta, lunga solo 3-4 centimetri, e si apre all'esterno appena davanti
    all'apertura della vagina [@seer-uretra].
  stato: approvato
  revisione: 2026-10-25

uretra-maschile:
  termine: uretra maschile
  latino: urethra masculina
  ta2: 3442
  parteDi: uretra
  definizione: >
    L'uretra dell'uomo: è lunga circa 20 centimetri, porta all'esterno sia l'urina sia lo sperma e
    si divide in tre tratti, prostatico, membranoso e spongioso [@seer-uretra].
  stato: approvato
  revisione: 2026-10-25

uretra-prostatica:
  termine: uretra prostatica
  latino: pars prostatica urethrae
  ta2: 3445
  parteDi: uretra
  definizione: >
    Il primo tratto dell'uretra maschile, vicino alla vescica, che attraversa la prostata
    [@seer-uretra]. Riceve i dotti eiaculatori e numerosi dotti della prostata
    [@seer-dotti-genitali].
  stato: approvato
  revisione: 2026-10-25

uretra-membranosa:
  termine: uretra membranosa
  latino: pars membranacea urethrae masculinae
  ta2: 3453
  parteDi: uretra
  definizione: >
    Il secondo tratto dell'uretra maschile, breve, che attraversa il pavimento pelvico ed entra nel
    pene [@seer-uretra].
  stato: approvato
  revisione: 2026-10-25

uretra-spongiosa:
  termine: uretra spongiosa
  latino: pars spongiosa urethrae
  ta2: 3455
  parteDi: uretra
  varianti: [uretra peniena]
  definizione: >
    Il terzo tratto dell'uretra maschile, il più lungo: percorre tutto il pene, all'interno del
    corpo spongioso, fino all'orifizio uretrale esterno sulla punta del pene [@seer-uretra]
    [@seer-pene]. Vi sboccano i dotti delle ghiandole bulbouretrali [@seer-dotti-genitali].
  stato: approvato
  revisione: 2026-10-25

orifizio-uretrale-esterno-maschile:
  termine: orifizio uretrale esterno maschile
  latino: ostium externum urethrae masculinae
  ta2: 3458
  parteDi: uretra
  varianti: [orifizio uretrale esterno, meato urinario]
  definizione: >
    L'apertura dell'uretra verso l'esterno. Nell'uomo si trova sulla punta del pene [@seer-uretra].
  stato: approvato
  revisione: 2026-10-25

# Apparato visivo (2026-10-26). Parti dell'occhio che non si scelgono da sole nel modello 3D e il
# chiasma ottico: "parteDi" indica la scheda che le descrive. Coroide, corpo ciliare, retina e le
# altre stanno dentro la sclera e non sono nel modello; "nelModello: true" segna quelle che ci sono,
# ma unite agli occhi (sclera, cornea, iride, cristallino) o ai nervi ottici (il chiasma).
# Termini verificati sul TA2 Viewer.

sclera:
  termine: sclera
  latino: sclera
  ta2: 6750
  parteDi: occhi
  nelModello: true
  varianti: [bianco dell'occhio]
  definizione: >
    Il bianco dell'occhio: la parte esterna e resistente della parete del bulbo oculare, che ne copre
    circa cinque sesti, in gran parte non visibili. Con la cornea, che sta davanti, forma lo strato
    fibroso dell'occhio [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

cornea:
  termine: cornea
  latino: cornea
  ta2: 6744
  parteDi: occhi
  nelModello: true
  definizione: >
    Lo strato trasparente, a forma di cupola, sul davanti dell'occhio. Fa entrare la luce e la piega:
    insieme al cristallino la mette a fuoco sulla retina [@nei-come-funzionano-occhi]
    [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

coroide:
  termine: coroide
  latino: chorioidea
  ta2: 6774
  parteDi: occhi
  definizione: >
    Strato di tessuto connettivo ricco di vasi sanguigni, nella parete dell'occhio dietro il corpo
    ciliare: porta il sangue al bulbo oculare. Con il corpo ciliare e l'iride forma lo strato
    vascolare dell'occhio [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

corpo-ciliare:
  termine: corpo ciliare
  latino: corpus ciliare
  ta2: 6765
  parteDi: occhi
  definizione: >
    Struttura muscolare della parete dell'occhio, coperta davanti dall'iride e unita al cristallino da sottili fibre
    di sostegno, le fibre zonulari. Insieme a queste fibre piega il cristallino, che così mette a
    fuoco la luce sul fondo dell'occhio [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

iride:
  termine: iride
  latino: iris
  ta2: 6753
  parteDi: occhi
  nelModello: true
  definizione: >
    La parte colorata dell'occhio. È un muscolo liscio che apre e chiude la pupilla e regola così
    quanta luce entra nell'occhio [@nei-come-funzionano-occhi] [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

pupilla:
  termine: pupilla
  latino: pupilla
  ta2: 6754
  parteDi: occhi
  varianti: [pupille]
  definizione: >
    Il foro al centro dell'occhio, circondato dall'iride, da cui la luce entra. In luce intensa
    l'iride la restringe, al buio la allarga [@nei-come-funzionano-occhi] [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

cristallino:
  termine: cristallino
  latino: lens
  ta2: 6798
  parteDi: occhi
  nelModello: true
  varianti: [lente]
  definizione: >
    Parte interna trasparente dell'occhio, che la luce attraversa dopo la pupilla. Lavora con la
    cornea per mettere a fuoco la luce sulla retina [@nei-come-funzionano-occhi]; il corpo ciliare e
    le sue fibre lo piegano per farlo [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

retina:
  termine: retina
  latino: retina
  ta2: 6776
  parteDi: occhi
  definizione: >
    Lo strato di tessuto sensibile alla luce sul fondo dell'occhio, il più interno della sua parete.
    I suoi fotorecettori, i coni e i bastoncelli, trasformano la luce in segnali elettrici, che
    arrivano al cervello attraverso il nervo ottico [@nei-come-funzionano-occhi] [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

umor-acqueo:
  termine: umor acqueo
  latino: humor aquosus
  ta2: 6791
  parteDi: occhi
  definizione: >
    Il liquido acquoso che riempie la cavità anteriore dell'occhio, lo spazio fra la cornea e il
    cristallino in cui si trovano anche l'iride e il corpo ciliare [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

corpo-vitreo:
  termine: corpo vitreo
  latino: corpus vitreum
  ta2: 6809
  parteDi: occhi
  varianti: [umor vitreo, vitreo]
  definizione: >
    Il contenuto della cavità posteriore dell'occhio, lo spazio che va dal cristallino alla retina:
    un liquido più denso dell'umor acqueo [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

disco-ottico:
  termine: disco ottico
  latino: discus nervi optici
  ta2: 6788
  parteDi: occhi
  varianti: [punto cieco, papilla ottica]
  definizione: >
    Il punto sul fondo dell'occhio in cui le fibre nervose della retina si riuniscono ed escono
    dall'occhio come nervo ottico. Lì non ci sono fotorecettori: è il punto cieco della retina, a cui
    corrisponde un punto cieco nel campo visivo [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

fovea:
  termine: fovea
  latino: fovea centralis
  ta2: 6785
  parteDi: occhi
  definizione: >
    Piccola infossatura al centro della retina che contiene solo fotorecettori, senza vasi sanguigni
    né cellule di sostegno. È il punto in cui la vista è più nitida [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-26

chiasma-ottico:
  termine: chiasma ottico
  latino: chiasma opticum
  ta2: 5668
  parteDi: nervo-ottico
  nelModello: true
  varianti: [chiasma]
  definizione: >
    Il punto in cui i due nervi ottici si incontrano. Qui le fibre che vengono dalla metà della retina
    verso il naso passano dall'altra parte, quelle della metà verso la tempia restano dallo stesso
    lato; oltre il chiasma le fibre prendono il nome di tratto ottico [@openstax-ap-14-2].
  stato: approvato
  revisione: 2026-10-26

# Parti dell'orecchio (2026-10-28): definizioni da OpenStax 14.1 e NIDCD "How Do We Hear?",
# termini latini verificati sui dati del TA2 Viewer 2.07.

padiglione-auricolare:
  termine: padiglione auricolare
  latino: auricula
  ta2: 6863
  parteDi: orecchi
  nelModello: true
  varianti: [padiglione, padiglioni, padiglioni auricolari, pinna]
  definizione: >
    La parte carnosa dell'orecchio esterno, ai lati della testa. Con le sue curve a forma di C
    indirizza le onde sonore verso il condotto uditivo [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

condotto-uditivo:
  termine: condotto uditivo
  latino: meatus acusticus externus
  ta2: 6867
  parteDi: orecchi
  varianti: [condotto uditivo esterno, meato acustico esterno]
  definizione: >
    Il passaggio stretto che dal padiglione porta al timpano [@nidcd-come-sentiamo]. Entra nel cranio
    attraverso un'apertura dell'osso temporale [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

timpano:
  termine: timpano
  latino: membrana tympanica
  ta2: 6870
  parteDi: orecchi
  varianti: [membrana timpanica]
  definizione: >
    La membrana in fondo al condotto uditivo, che vibra quando la colpiscono le onde sonore
    [@openstax-ap-14-1] e passa le vibrazioni agli ossicini dell'orecchio medio [@nidcd-come-sentiamo].
  stato: approvato
  revisione: 2026-10-28

ossicini:
  termine: ossicini dell'udito
  latino: ossicula auditus
  ta2: 6923
  parteDi: orecchi
  varianti: [ossicini, martello, incudine, staffa]
  definizione: >
    Le tre piccole ossa dell'orecchio medio: il martello, attaccato al timpano, l'incudine e la staffa,
    attaccata all'orecchio interno [@openstax-ap-14-1]. Amplificano le vibrazioni del timpano e le
    trasmettono alla coclea [@nidcd-come-sentiamo].
  stato: approvato
  revisione: 2026-10-28

tuba-uditiva:
  termine: tuba uditiva
  latino: tuba auditiva
  ta2: 6926
  parteDi: orecchi
  varianti: [tuba di Eustachio, tromba di Eustachio]
  definizione: >
    Il condotto che collega l'orecchio medio alla faringe e pareggia la pressione dell'aria sui due
    lati del timpano. Di solito è chiusa e si apre deglutendo o sbadigliando [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

coclea:
  termine: coclea
  latino: cochlea
  ta2: 6964
  parteDi: orecchi
  varianti: [chiocciola]
  definizione: >
    La parte dell'orecchio interno che serve all'udito: una struttura a forma di chiocciola, piena di
    liquido [@nidcd-come-sentiamo], in cui le cellule ciliate trasformano le vibrazioni in segnali
    nervosi; i suoni acuti si sentono vicino alla base, quelli gravi vicino alla punta
    [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

vestibolo:
  termine: vestibolo
  latino: vestibulum
  ta2: 6942
  parteDi: orecchi
  definizione: >
    La parte dell'orecchio interno che serve all'equilibrio. Comprende l'utricolo e il sacculo, che
    sentono la posizione della testa, e da esso partono i tre canali semicircolari
    [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

canali-semicircolari:
  termine: canali semicircolari
  latino: canales semicirculares
  ta2: 6954
  parteDi: orecchi
  varianti: [canale semicircolare]
  definizione: >
    Tre canali ad anello dell'orecchio interno, uno orizzontale e due verticali, che sentono la
    rotazione della testa: quando la testa gira, il liquido al loro interno resta indietro e piega le
    stereociglia delle cellule ciliate [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

nervo-vestibolococleare:
  termine: nervo vestibolococleare
  latino: nervus vestibulocochlearis
  ta2: 6307
  parteDi: orecchi
  varianti: [ottavo nervo cranico, nervo cranico VIII, nervo acustico]
  definizione: >
    L'ottavo dei nervi cranici, il nervo dell'udito e dell'equilibrio; è solo sensitivo: porta i
    segnali dall'orecchio al cervello [@openstax-ap-13-4]. È fatto di due fasci di fibre, uno che
    parte dalla coclea e uno dal vestibolo, che viaggiano insieme fino al tronco encefalico; i
    segnali dell'equilibrio arrivano anche al cervelletto [@openstax-ap-14-1].
  stato: approvato
  revisione: 2026-10-28

# Parti della mammella (2026-10-30), indicate nella figura "L'interno della mammella": definizioni da
# SEER "Mammary Glands" e OpenStax 27.2, rilette il 2026-10-30; termini latini verificati sui dati
# del TA2 Viewer 2.07. Capezzolo e areola sono nel modello 3D, uniti alla mammella; il tessuto adiposo
# non ha un termine proprio nella TA2. Il grande pettorale ha una scheda sua e non ha "parteDi".

capezzolo:
  termine: capezzolo
  latino: papilla mammaria
  ta2: 7105
  parteDi: mammelle
  nelModello: true
  varianti: [capezzoli]
  definizione: >
    La sporgenza al centro della mammella, circondata dall'areola [@seer-ghiandole-mammarie]
    [@openstax-ap-27-2]. Contiene muscolatura liscia, per cui è sensibile al tatto e diventa eretto
    quando è stimolato; sulla sua superficie si aprono, ciascuno per conto suo, i dotti galattofori
    [@seer-ghiandole-mammarie].
  stato: approvato
  revisione: 2026-10-30

areola:
  termine: areola
  latino: areola mammae
  ta2: 7106
  parteDi: mammelle
  nelModello: true
  varianti: [areole, ghiandole areolari]
  definizione: >
    L'area pigmentata, di solito circolare, che circonda il capezzolo: il suo colore può scurirsi in
    gravidanza e il diametro varia da 25 a 100 mm [@openstax-ap-27-2]. Vi si trovano piccole
    ghiandole rilevate, le ghiandole areolari, che durante l'allattamento secernono un liquido
    lubrificante che protegge il capezzolo [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-30

lobo-mammario:
  termine: lobo della ghiandola mammaria
  latino: lobi glandulae mammariae
  ta2: 7101
  parteDi: mammelle
  varianti: [lobi della ghiandola mammaria, lobo mammario, lobi mammari, lobi della mammella]
  definizione: >
    Ciascuna delle 15-20 parti di tessuto ghiandolare della mammella adulta, disposte a raggiera
    intorno al capezzolo e separate da tessuto connettivo e adiposo. Ogni lobo è formato da lobuli e
    ha un suo dotto galattoforo [@seer-ghiandole-mammarie].
  stato: approvato
  revisione: 2026-10-30

lobulo-mammario:
  termine: lobulo della ghiandola mammaria
  latino: lobuli glandulae mammariae
  ta2: 7102
  parteDi: mammelle
  varianti: [lobuli della ghiandola mammaria, lobulo mammario, lobuli mammari, lobulo, lobuli]
  definizione: >
    Ciascuna delle piccole parti di cui è formato un lobo della mammella; contiene le unità
    ghiandolari [@seer-ghiandole-mammarie]. Il latte è prodotto da gruppi di cellule riuniti in
    grappoli, gli alveoli, circondati da cellule che si contraggono e spingono il latte verso i seni
    galattofori [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-30

dotto-galattoforo:
  termine: dotto galattoforo
  latino: ductus lactiferi
  ta2: 7103
  parteDi: mammelle
  varianti: [dotti galattofori, dotto lattifero, dotti lattiferi]
  definizione: >
    Il condotto che raccoglie il latte dai lobuli di un lobo e lo porta al capezzolo
    [@seer-ghiandole-mammarie]. Ogni mammella ne ha da 15 a 20, che si aprono sulla superficie del
    capezzolo [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-30

seno-galattoforo:
  termine: seno galattoforo
  latino: sinus lactiferi
  ta2: 7104
  parteDi: mammelle
  varianti: [seni galattofori, ampolla galattofora]
  definizione: >
    Il tratto allargato di un dotto galattoforo poco prima del capezzolo, che fa da serbatoio per il
    latte; dopo il seno il dotto si restringe di nuovo [@seer-ghiandole-mammarie]. Durante
    l'allattamento il neonato, succhiando, richiama il latte dai seni attraverso i dotti
    [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-30

tessuto-adiposo-mammella:
  termine: tessuto adiposo della mammella
  parteDi: mammelle
  varianti: [tessuto adiposo, grasso della mammella]
  definizione: >
    Il grasso che circonda i lobi della mammella; la sua quantità e la sua distribuzione determinano
    grandezza e forma della mammella [@seer-ghiandole-mammarie] [@openstax-ap-27-2], che non
    influiscono sulla quantità di latte prodotto [@openstax-ap-27-2]. Alla pubertà gli estrogeni ne
    fanno aumentare l'accumulo [@seer-ghiandole-mammarie].
  stato: approvato
  revisione: 2026-10-30

legamenti-sospensori:
  termine: legamenti sospensori della mammella
  latino: ligamenta suspensoria mammaria
  ta2: 7109
  parteDi: mammelle
  varianti: [legamento sospensore, legamenti sospensori, legamenti di Cooper]
  definizione: >
    Fasci di tessuto connettivo che sostengono la mammella: la attraversano dai muscoli sottostanti
    fino alla pelle [@seer-ghiandole-mammarie] e collegano il tessuto della mammella al derma
    [@openstax-ap-27-2].
  stato: approvato
  revisione: 2026-10-30

muscolo-grande-pettorale:
  termine: muscolo grande pettorale
  latino: musculus pectoralis major
  ta2: 2301
  varianti: [grande pettorale, muscoli grandi pettorali]
  definizione: >
    Il muscolo spesso, a forma di ventaglio, che copre gran parte della metà superiore del torace
    anteriore e muove l'omero [@openstax-ap-11-5]; le ghiandole mammarie si trovano sopra di esso
    [@seer-ghiandole-mammarie].
  stato: approvato
  revisione: 2026-10-30
